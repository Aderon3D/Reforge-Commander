name: Sync upstream forge

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch the required checks below.
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add forge https://github.com/Card-Forge/forge.git
          # Explicit refspecs so the remote-tracking refs this job depends on
          # always exist. The runner logged `origin/master -> FETCH_HEAD` with
          # no `origin/master` update, so `origin/master` did not resolve and
          # Check backlog died on it — and with no origin/sync/upstream ref,
          # --force-with-lease had no expectation to compare against, leaving
          # the force push unguarded. I could not reproduce actions/checkout's
          # exact refspec locally, so the refspecs are pinned rather than
          # relying on git's opportunistic remote-tracking updates, and the
          # rev-parse guards below fail loudly if a ref is ever missing again.
          git fetch forge +refs/heads/master:refs/remotes/forge/master
          git fetch origin +refs/heads/master:refs/remotes/origin/master
          git fetch origin +refs/heads/sync/upstream:refs/remotes/origin/sync/upstream || true
          git rev-parse --verify refs/remotes/origin/master
          git rev-parse --verify refs/remotes/forge/master

      - name: Check backlog
        id: behind
        run: |
          RAW=$(git rev-list --count origin/master..forge/master)
          # `grep -c` prints 0 and exits 1 when nothing matches, which under
          # `bash -e` killed the whole run every time we were already up to
          # date. Swallow the exit status but keep the count.
          HONEST=$(git cherry origin/master forge/master | grep -c '^+' || true)
          echo "raw=$RAW honest=$HONEST (content-absent commits)"
          echo "behind=$HONEST" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        if: steps.behind.outputs.behind > 0
        run: |
          git config user.name "Reforge"
          git config user.email "dev@reforge-commander.dev"
          # Start fresh from master (our latest) so the branch always contains
          # all fork content.  Merge upstream; auto-resolve every conflict by
          # keeping our version — upstream changes in non-conflicting files
          # land cleanly, conflicting files keep master's copy for manual review.
          git checkout -B sync/upstream origin/master
          if git merge --no-edit forge/master; then
            echo "Clean merge — no conflicts."
          else
            CONFLICTS=$(git ls-files -u | awk '{print $4}' | sort -u)
            if [ -n "$CONFLICTS" ]; then
              echo "::warning::Auto-resolved merge conflicts (kept fork version): $CONFLICTS"
              git checkout --ours -- $CONFLICTS
              git add $CONFLICTS
              git commit --no-edit
            else
              echo "::error::Merge failed but no conflicted files found"
              exit 1
            fi
          fi

      - name: Drop inherited upstream workflows
        if: steps.behind.outputs.behind > 0
        run: |
          # GITHUB_TOKEN may not create or update workflow files, so any
          # workflow file the merge introduces from upstream makes the push
          # fail outright and nothing can sync. Upstream's workflows are also
          # Card-Forge-specific — most are gated on
          # `github.repository_owner == 'Card-Forge'` — and mtg-fetch-cards.yml
          # is upstream's own card-fetch bot, none of which we want running
          # here. So drop the workflow files this merge adds and keep the
          # fork's existing ones untouched.
          ADDED=$(git diff --name-only --diff-filter=A origin/master HEAD -- .github/workflows/ || true)
          if [ -n "$ADDED" ]; then
            echo "::warning::Not inheriting upstream workflow files: $ADDED"
            git rm -q -- $ADDED
          fi
          # Idempotent: nothing added on most runs, and committing with an
          # empty index exits 1 and would fail the run.
          if git diff --cached --quiet; then
            echo "No upstream workflow files to drop."
          else
            git commit -q -m "ci: do not inherit upstream workflow files"
          fi

      - name: Adopt upstream desktop test stack
        if: steps.behind.outputs.behind > 0
        run: |
          # Upstream migrated the desktop suite off PowerMockito.mockStatic to
          # Mockito.mockStatic, which needs mockito-core 5.x (inline mock maker).
          # Our 3.12.4 pin exists only to keep PowerMock 2.0.9 working, and the
          # guard test enforcing it (MockitoDependencyVersionTest) contradicts
          # the merged tree. Left in place, Test build fails with
          # "SubclassByteBuddyMockMaker does not support the creation of static
          # mocks" in 6 test cases and the sync can never land.
          #
          # Guarded: if upstream reintroduces PowerMock we leave our stack alone.
          if git show forge/master:forge-gui-desktop/pom.xml | grep -q powermock; then
            echo "Upstream uses PowerMock again; keeping our test stack."
            exit 0
          fi
          VERSION=$(git show forge/master:forge-gui-desktop/pom.xml \
            | sed -n '/<artifactId>mockito-core<\/artifactId>/{n;s/.*<version>\([^<]*\)<\/version>.*/\1/p;}')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read mockito-core version from upstream pom"
            exit 1
          fi
          echo "Upstream no longer uses PowerMock; adopting mockito-core $VERSION"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          path = 'forge-gui-desktop/pom.xml'
          text = open(path, encoding='utf-8').read()
          updated, n = re.subn(
              r'(<artifactId>mockito-core</artifactId>\s*<version>)[^<]*(</version>)',
              r'\g<1>' + version + r'\g<2>', text, count=1)
          if n != 1:
              raise SystemExit('expected exactly one mockito-core dependency, found %d' % n)
          open(path, 'w', encoding='utf-8').write(updated)
          PY
          git rm -q --ignore-unmatch forge-gui-desktop/src/test/java/forge/MockitoDependencyVersionTest.java
          git add forge-gui-desktop/pom.xml
          # Idempotent: once master has already adopted upstream's version the
          # rewrite is a no-op and there is nothing staged, so committing would
          # exit 1 and fail the run.
          if git diff --cached --quiet; then
            echo "Already on mockito-core $VERSION; nothing to change."
          else
            git commit -q -m "test(desktop): adopt upstream mockito-core for the merged tree"
          fi

      - name: Push sync branch
        if: steps.behind.outputs.behind > 0
        id: push
        run: |
          # Branch is rebuilt from master each run (checkout -B above), so the
          # remote tip from the previous run's merge will never fast-forward.
          # --force-with-lease still guards against a concurrent writer.
          git push --force-with-lease origin sync/upstream
          echo "head=$(git rev-parse sync/upstream)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.behind.outputs.behind > 0
        id: pr
        run: |
          pr=$(gh pr list --base master --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base master --head sync/upstream \
              --title "chore: sync with upstream forge (${{ steps.behind.outputs.behind }} commits)" \
              --body "Automated sync from Card-Forge/forge master. Merges only after CI passes.")
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Dispatch required checks
        if: steps.behind.outputs.behind > 0
        run: |
          # This job rebuilds sync/upstream from master every run, so every push
          # is a forced update -- and a force-push to a PR head does not fire
          # `synchronize`. Without this, no CI ever runs on the sync's own PR and
          # it sits BLOCKED on the Condom ruleset indefinitely. workflow_dispatch
          # does work with this token.
          #
          # Dispatched after the push so the workflow files on sync/upstream
          # already carry the workflow_dispatch trigger.
          for wf in test-build.yaml codeql.yml ios-compat-gate.yml; do
            if ! gh workflow run "$wf" --ref sync/upstream; then
              echo "::error::Could not dispatch $wf on sync/upstream -- it must exist on the branch with a workflow_dispatch trigger"
              exit 1
            fi
            echo "Dispatched $wf on sync/upstream"
          done

      - name: Wait for CI
        if: steps.behind.outputs.behind > 0
        run: |
          HEAD=${{ steps.push.outputs.head }}
          # Exactly what the Condom ruleset requires, plus the documented
          # platform-parity gate. Waiting on "any check" is not enough: the
          # automatic dependency submission finishes in seconds and used to
          # satisfy this step on its own.
          REQUIRED=("Test with Java 21" "CodeQL" "iOS/MobiVM link audit")
          for i in $(seq 1 90); do
            DATA=$(gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')
            PENDING=""
            FAILED=""
            for name in "${REQUIRED[@]}"; do
              # null conclusion means queued or in progress; absent check runs
              # also read as null via `first`.
              STATE=$(echo "$DATA" | jq -r --arg n "$name" \
                '[.check_runs[] | select(.name == $n)] | first | (.conclusion // "pending")')
              case "$STATE" in
                success|neutral) ;;
                pending) PENDING="$PENDING $name" ;;
                *) FAILED="$FAILED $name=$STATE" ;;
              esac
            done
            echo "iteration ${i}/90 — pending:${PENDING:- none} failed:${FAILED:- none}"
            if [ -n "$FAILED" ]; then
              echo "::error::CI checks failed on $HEAD:$FAILED"
              echo "$DATA" | jq -r '.check_runs[] | "\(.name): \(.conclusion // .status)"'
              exit 1
            fi
            if [ -z "$PENDING" ]; then
              echo "All required checks passed on $HEAD"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI checks on $HEAD"
          exit 1

      - name: Merge pull request
        if: steps.behind.outputs.behind > 0
        run: |
          PR=${{ steps.pr.outputs.number }}
          gh pr merge "$PR" --merge --auto || gh pr merge "$PR" --merge
