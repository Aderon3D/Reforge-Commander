name: PR create repro
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR
        run: gh pr create --base master --head pr-create-repro --title "repro test" --body "repro" --draft
        env:
          GH_TOKEN: ${{ github.token }}
