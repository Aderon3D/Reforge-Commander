name: PR create repro
on: push
permissions:
  contents: write
  pull-requests: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR
        run: gh pr create --base master --head pr-create-repro --title "repro test" --body "repro"
