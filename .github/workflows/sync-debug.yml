name: Sync debug copy
on: push
permissions:
  contents: write
  pull-requests: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Card-Forge/forge.git
          git fetch upstream master
          git fetch origin sync/upstream || true
      - name: Merge
        run: |
          git config user.name "Reforge"
          git config user.email "dev@reforge-commander.dev"
          if [ "$(git rev-parse --verify origin/sync/upstream 2>/dev/null)" ]; then
            git checkout -b sync/upstream origin/sync/upstream
          else
            git checkout -b sync/upstream master
          fi
          git merge --no-edit master
          git merge --no-edit upstream/master
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Merge conflicts"
            exit 1
          fi
      - name: Push sync branch
        run: git push origin sync/upstream
      - name: Open pull request
        id: pr
        run: |
          pr=$(gh pr list --base master --head sync/upstream --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base master --head sync/upstream \
              --title "debug gitops test" --body "debug")
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
