name: Sync debug copy
on: push
permissions:
  contents: write
  pull-requests: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open pull request
        id: pr
        run: |
          pr=$(gh pr list --base master --head debug/sync-copy --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --base master --head debug/sync-copy \
              --title "debug list-test" --body "debug")
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
